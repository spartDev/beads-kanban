<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eef1f4" />
    <title>beads-desktop</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Thème posé avant le premier rendu (pas d'éclair clair en thème sombre), avec la couleur de la barre du
      // navigateur mobile. Même clé, même règle et mêmes couleurs que theme/theme.ts (un test les compare) :
      // préférence mémorisée, sinon le système.
      (function () {
        var preference = null;
        try {
          preference = localStorage.getItem('beads-desktop:theme');
        } catch (e) {}
        var dark =
          preference === 'dark' ||
          (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute('content', dark ? '#0a1222' : '#eef1f4');
      })();
      // Langue posée avant le premier rendu (<html lang> : lecteurs d'écran, césure). Même clé, même drapeau et même règle que
      // i18n/language.ts (un test les compare) : préférence mémorisée, sinon la première langue du navigateur connue, l'anglais à
      // défaut ; le français tant que le sélecteur n'est pas activé.
      (function () {
        var LANGUAGE_SWITCH_ENABLED = false;
        var known = ['fr', 'en'];
        var language = 'fr';
        if (LANGUAGE_SWITCH_ENABLED) {
          var preference = null;
          try {
            preference = localStorage.getItem('beads-desktop:language');
          } catch (e) {}
          if (known.indexOf(preference) >= 0) {
            language = preference;
          } else {
            language = 'en';
            var tags = navigator.languages && navigator.languages.length > 0 ? navigator.languages : [navigator.language];
            for (var i = 0; i < tags.length; i++) {
              var primary = String(tags[i] == null ? '' : tags[i]).toLowerCase().split('-')[0];
              if (known.indexOf(primary) >= 0) {
                language = primary;
                break;
              }
            }
          }
        }
        document.documentElement.lang = language;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
